<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: an operations room for an education network, dense, calm, exact
   IDEA a transit control board: teachers are lines, schools are stations, the week is the timetable
   PICTURE the live week board and dashboard charts, drawn only from stored records
   COLOUR deep green #00463c rail, white ground, lime-white #e6f5c8 for live work, coral #ff6f59 for trouble
   TYPE Inter Tight 700/800 display + Inter text
   LAYOUT green rail left with navigation, content right; under 900px the rail becomes a top bar with a scrolling nav */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1311);--ink:light-dark(#0f1a17,#e6eee9);--mut:light-dark(#5a6a65,#93a59e);--line:light-dark(#e1e8e4,#22302b);--panel:light-dark(#f4f8f5,#131c19);--rail:light-dark(#00463c,#062b25);--lime:#e6f5c8;--coral:#ff6f59;--acc:light-dark(#00463c,#86dcb9);--accInk:light-dark(#ffffff,#06231d);--ok:light-dark(#0b7a4f,#5ad19a);--warnBg:light-dark(#fff1d6,#3a2c10);--warnInk:light-dark(#7a4b00,#ffd27a);--badBg:light-dark(#ffe3dd,#3d1a14);--badInk:light-dark(#a62a14,#ff9c8a);--revBg:light-dark(#e3ecff,#18233d);--revInk:light-dark(#1c3f8f,#a9c1ff)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:clamp(26px,3vw,36px);font-weight:800;text-wrap:balance}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font:800 26px/1 "Inter Tight",sans-serif;letter-spacing:-.03em}
.brand span{font-size:12px;opacity:.75;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;text-decoration:none;padding:6px 10px;line-height:1.25;border-radius:8px;font-weight:500;opacity:.86}
.nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.nav a.on{background:var(--lime);color:#00463c;opacity:1;font-weight:600}
.nav .n{font-size:12px;background:var(--coral);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.later{font-size:12.5px;opacity:.6;padding:0 10px;line-height:1.7}
.later b{display:block;font-weight:600;opacity:.9}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding:12px 8px 0;font-size:13px}
.who b{display:block;font-size:14px}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px max(3vw,16px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top .crumb{font-weight:600;color:var(--mut);font-size:14px}
.sp{flex:1}
.view{padding:24px max(3vw,16px) 64px;display:flex;flex-direction:column;gap:22px;max-width:1400px;width:100%}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.hd .sub{color:var(--mut);margin-top:6px;max-width:70ch}
.hd .acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accInk);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.bad{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;min-height:36px;cursor:pointer;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select,.bar input{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:14px;max-width:220px}
.bar input[type=search]{min-width:220px}
.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--bg)}
.panel.tint{background:var(--panel)}
.panel>h3{margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel>h3 small{font:500 13px Inter,sans-serif;color:var(--mut);letter-spacing:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.met{padding:14px 14px 14px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.met:hover .v{color:var(--acc)}
.met .v{font:800 clamp(26px,3vw,34px)/1 "Inter Tight",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.met .l{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.3}
.met.bad .v{color:var(--coral)}
.hbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:13.5px;padding:4px 0}
.hbar .t{height:12px;background:var(--panel);border-radius:3px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--acc)}
.hbar .t i.c{background:var(--coral)}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end;height:170px;padding-top:18px}
.cols .c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;text-align:center;font-size:12px;color:var(--mut)}
.cols .stk{display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-height:2px;background:var(--line)}
.cols .stk i{display:block;background:var(--acc)}
.cols .stk i.p{background:color-mix(in srgb,var(--acc) 35%,var(--bg))}
.cols .c b{color:var(--ink);font-variant-numeric:tabular-nums}
.dist{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--panel)}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--mut);white-space:nowrap;border:1px solid var(--line)}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,var(--bg));color:var(--ok);border-color:transparent}
.chip.ok2{background:color-mix(in srgb,var(--ok) 8%,var(--bg));color:var(--ok)}
.chip.live{background:var(--lime);color:#2d4a00;border-color:transparent}
.chip.rev{background:var(--revBg);color:var(--revInk);border-color:transparent}
.chip.warn{background:var(--warnBg);color:var(--warnInk);border-color:transparent}
.chip.bad{background:var(--badBg);color:var(--badInk);border-color:transparent}
.chip.off{text-decoration:line-through}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--mut);font-size:12.5px;border-bottom:1px solid var(--line);padding:8px}
.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.mut{color:var(--mut)}
.small{font-size:13px}
.nw{white-space:nowrap}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start;cursor:pointer}
.li:last-child{border-bottom:0}
.li .tm{font:700 18px/1.1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:3.2em}
.li .tm small{display:block;font:500 12px Inter,sans-serif;color:var(--mut)}
.li .ttl{font-weight:600}
.li .meta{font-size:13px;color:var(--mut)}
.li.bad .tm{color:var(--coral)}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1080px}
.day{background:var(--panel);border-radius:10px;padding:8px;min-height:260px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.day.over{border-color:var(--acc)}
.day.today{box-shadow:inset 0 3px 0 var(--acc)}
.day h4{margin:0 0 4px;font:700 14px "Inter Tight",sans-serif;display:flex;justify-content:space-between;gap:4px}
.day h4 small{font:500 11.5px Inter,sans-serif;color:var(--mut)}
.day .tag{font-size:11.5px;color:var(--mut);margin:-4px 0 4px}
.ev{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:7px 8px;font-size:13px;cursor:pointer;line-height:1.35}
.ev[draggable=true]{cursor:grab}
.ev b{display:block;font-variant-numeric:tabular-nums}
.ev .tp{font-weight:600;display:block}
.ev.cf{border-left-color:var(--coral);background:color-mix(in srgb,var(--coral) 7%,var(--bg))}
.ev.st-Completed{border-left-color:var(--ok)}
.ev.st-Cancelled,.ev.st-Postponed{opacity:.6;border-left-style:dashed}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.month>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:6px;font-size:12px;cursor:pointer}
.month>div.out{background:var(--panel);color:var(--mut)}
.month>div.today .d{background:var(--acc);color:var(--accInk);border-radius:99px;padding:0 6px}
.month .d{font-weight:700;font-size:13px;display:inline-block}
.month .e{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.month .wh{font-weight:600;color:var(--mut);min-height:auto;cursor:default}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px;border:2px solid transparent}
.kcol.over{border-color:var(--acc)}
.kcol h4{margin:0;font-size:13.5px;display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--acc)}
.card .t{font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.gantt{display:grid;grid-template-columns:minmax(0,14em) minmax(0,1fr);gap:6px 12px;font-size:13px;align-items:center;min-width:640px}
.gantt .trk{position:relative;height:22px;background:var(--panel);border-radius:4px}
.gantt .trk i{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--acc)}
.gantt .trk i.bad{background:var(--coral)}
.gantt .trk i.done{background:var(--ok)}
.gantt .trk em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--coral)}
.gantt .ax{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:99px;background:var(--lime);color:#00463c;font:700 11px Inter,sans-serif;flex:none}
.avs{display:flex;gap:2px;flex-wrap:wrap}
.alert{border-left:4px solid var(--coral);background:var(--badBg);color:var(--badInk);padding:10px 12px;border-radius:6px;font-size:14px}
.alert.soft{border-color:#d99a00;background:var(--warnBg);color:var(--warnInk)}
.alert.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg));color:var(--ink)}
.note{font-size:13px;color:var(--mut)}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.kv{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;white-space:pre-wrap}
.files{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.fbadge{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:8px;background:var(--rail);color:var(--lime);font:800 12px "Inter Tight",sans-serif;flex:none}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--panel)}
.modal{position:fixed;inset:0;background:rgba(5,15,12,.55);display:grid;place-items:start center;padding:4vh 12px;z-index:50;overflow-y:auto}
.modal[hidden]{display:none}
.sheet{background:var(--bg);border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{flex:1}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--mut);width:40px;height:40px}
.mb{padding:18px 20px;max-height:70vh;overflow-y:auto}
.mf{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.fld input[type=checkbox]{width:auto}
.req{color:var(--coral)}
.sec{margin-top:6px;font-size:14px;color:var(--mut)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:180px;overflow-y:auto}
.ck{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:400!important}
.err{color:var(--coral);font-weight:600;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.boot{display:grid;place-items:center;min-height:100%;padding:24px;text-align:center}
.boot .box{max-width:520px;display:flex;flex-direction:column;gap:14px;align-items:center}
.boot b.logo{font:800 56px/1 "Inter Tight",sans-serif;color:var(--acc);letter-spacing:-.04em}
.cmt{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.cmt small{color:var(--mut)}
.pill{font-size:12px;color:var(--mut)}
.paper{--ink:#111;--mut:#555;--line:#dcdcdc;--bg:#fff;--panel:#f3f5f4;color:#111;background:#fff;color-scheme:light}
.paper .tbl{font-size:13px}
button.card[disabled]{opacity:.55;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px}.nav{flex-direction:row;overflow-x:auto;width:100%;order:3}.nav a{white-space:nowrap}.later,.who{display:none}.top{position:static}}
@media(max-width:700px){.g2,.g3,.grid2{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}.hbar{grid-template-columns:minmax(0,7em) minmax(0,1fr) 2.6em}.bar input[type=search]{min-width:0;width:100%}.bar select{max-width:100%;flex:1 1 140px}}
@media(max-width:600px){.tbl{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 4px;text-align:right}.stack td::before{content:attr(data-l);color:var(--mut);text-align:left}.stack td:empty{display:none}}
details.panel>summary{cursor:pointer;list-style-position:inside}.pwwrap{position:relative;display:block}.pwwrap input{padding-right:44px!important}.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:6px;padding:0}.pweye:hover,.pweye:focus-visible{color:var(--ink);background:var(--line)}.pweye svg{width:20px;height:20px}

.menubtn,.scrim{display:none}
.notif{gap:6px}.notif .cnt{background:var(--coral);color:#fff;border-radius:999px;font-size:11.5px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-weight:700}
.notif svg{display:none}
body.navlock{overflow:hidden}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .rail{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);height:100dvh;flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding:18px 12px calc(18px + env(safe-area-inset-bottom));gap:14px;z-index:60;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto}
 .app.navopen .rail{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
 .nav{flex-direction:column;overflow:visible;width:auto;order:0;gap:2px}
 .nav a{white-space:normal;padding:12px;font-size:15.5px;min-height:46px}
 .who{display:block}
 .scrim{display:block;position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
 .app.navopen .scrim{opacity:1;pointer-events:auto}
 .top{position:sticky;top:0;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));gap:8px;z-index:20;flex-wrap:nowrap}
 .menubtn{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;cursor:pointer;flex:none}
 .top .crumb{font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
 .top .sp{display:none}
 .top .chip.warn{display:none}
 .hide-m{display:none!important}
 .notif{min-width:44px;min-height:44px;padding:0 10px}
 .notif .lbl{display:none}.notif svg{display:block}
 .langsw button{padding:0 9px;min-height:40px;font-size:12.5px}
}
@media(max-width:700px){
 .view{padding:16px 12px calc(48px + env(safe-area-inset-bottom));gap:16px}
 h1{font-size:24px;line-height:1.15}
 .hd{align-items:stretch;gap:10px}
 .hd .acts{margin-left:0;width:100%}
 .hd .acts .btn{flex:1 1 auto}
 .btn{min-height:44px}.btn.sm{min-height:38px}
 .week{grid-template-columns:minmax(0,1fr);min-width:0}
 .seg{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}

 }catch(e){if(e instanceof Error)throw e;throw new Error(`«${file.name}»: ${map[e?.code]||'жүктеу сәтсіз аяқталды'}.`)}
}

function kpiCfg(){const w={};for(const d of KPI_DEF)w[d.k]=+(S.kpiCfg?.weights?.[d.k]??d.w);return {w,pdTarget:+(S.kpiCfg?.pdTarget??18)}}
const perKey=per=>per+'_'+range(per)[0];
const krPct=k=>{const b=+k.baseline||0,t=+k.target,c=+k.current||0;if(!isFinite(t)||t===b)return c>=t?100:0;return Math.max(0,Math.min(100,(c-b)/(t-b)*100))};
const okrPct=o=>(o.krs||[]).length?o.krs.reduce((a,k)=>a+krPct(k),0)/o.krs.length:0;
const curQ=()=>{const d=new Date();return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1)};
const r0=x=>x==null?'—':String(Math.round(x));
const kpiStaff=()=>S.members.filter(m=>m.active!==false&&[...TEACHER_ROLES,'coordinator','pm'].includes(m.role)).sort(by('name'));
const kpiBand=x=>x==null?['Дерек жоқ','']:x>=85?['Жоғары','ok']:x>=60?['Қанағаттанарлық','live']:['Қолдау қажет','warn'];
const loadOf=(id,rg)=>S.events.filter(e=>e.teacherId===id&&inR(e.date,rg)&&live(e)).length+S.tasks.filter(t=>(t.assignees||[]).includes(id)&&openTask(t)).length;
function kpi(mid,per){
 const rg=range(per),cfg=kpiCfg(),t0=today(),v={},det={};
 const due=S.tasks.filter(t=>(t.assignees||[]).includes(mid)&&t.status!=='Cancelled'&&t.due&&inR(t.due,rg)&&t.due<=t0);

function applyVisitSchools(m,sel,days,home,keep){
 const old=visitsOf(m),want=(sel||[]).filter(s=>s&&s!==home&&Sc(s));
 const kept=keep?old.filter(x=>x.schoolId!==home):old.filter(x=>want.includes(x.schoolId));
 const added=want.filter(s=>!kept.some(x=>x.schoolId===s));
 const visits=[...kept,...added.map(s=>({schoolId:s,days:(days||[]).slice(),note:'',at:now(),by:myId()||''}))];
 const all=[...new Set([...(days||[]),...visits.flatMap(x=>x.days||[])])].sort((a,b)=>a-b);
 return {visits,days:all,added};
}

async function removeMember(id){
 const m=M(id);if(!canRemove(m)||m.active===false)return;
 const tasks=S.tasks.filter(t=>openTask(t)&&(t.assignees||[]).includes(id));
 const evs=S.events.filter(e=>e.teacherId===id&&e.date&&e.date>=today()&&live(e));
 const prjs=S.projects.filter(p=>!['Completed','Cancelled'].includes(p.status)&&(p.pmId===id||(p.team||[]).includes(id)));
 const lead=prjs.filter(p=>p.pmId===id);
 const fields=[{k:'reason',l:'Себебі (міндетті емес)',t:'textarea',rows:2,full:1}];
 if(tasks.length||lead.length)fields.push({k:'to',l:[tasks.length?`${tasks.length} ашық тапсырмасын`:'',lead.length?`${lead.length} жобаның жетекшілігін`:''].filter(Boolean).join(' және ')+' кімге беру',t:'select',o:memOpts('— ешкімге бермеу',x=>x.id!==id),full:1});
 if(evs.length)fields.push({k:'ev',l:`Кестедегі алдағы ${evs.length} іс-шарасы`,t:'select',o:[['keep','Өзгеріссіз қалдыру (кейін өзім ауыстырамын)'],['cancel','Барлығын тоқтату (Cancelled)']],full:1});
 const v=await form('Командадан шығару: '+m.name,fields,{reason:'',to:'',ev:'keep'});if(!v)return;
 const sum=[`${m.name} жүйеге кіре алмайды және тапсырма, кесте тізімдерінде көрінбейді.`,tasks.length?(v.to?`${tasks.length} тапсырмасы ${mn(v.to)} атына беріледі.`:`${tasks.length} тапсырмадан аты алынады.`):'',lead.length?(v.to?`${lead.length} жобаның жетекшісі ${mn(v.to)} болады.`:`${lead.length} жоба жетекшісіз қалады.`):'',evs.length?(v.ev==='cancel'?`Алдағы ${evs.length} іс-шарасы тоқтатылады.`:`Алдағы ${evs.length} іс-шарасы кестеде қалады.`):'','Бұрынғы есептері, тарихы мен материалдары сақталады. Кейін «Командаға қайтару» арқылы қайта қосуға болады.'].filter(Boolean).join(' ');
 if(!await ask('Растаңыз',sum,'Командадан шығару',1))return;
 if(!await upd('members',id,{active:false,removedAt:now(),removedBy:myId()||'',removedReason:v.reason||''}))return;
 let nt=0,np=0,ne=0;
 for(const t of tasks){const a=(t.assignees||[]).filter(x=>x!==id);if(v.to&&!a.includes(v.to))a.push(v.to);if(await upd('tasks',t.id,{assignees:a}))nt++}
 for(const pr of prjs){const d={team:(pr.team||[]).filter(x=>x!==id)};if(pr.pmId===id){d.pmId=v.to||'';if(v.to&&!d.team.includes(v.to))d.team.push(v.to)}if(await upd('projects',pr.id,d))np++}
 if(v.ev==='cancel')for(const e of evs)if(await upd('events',e.id,{status:'Cancelled'}))ne++;
 if(v.to&&(nt||lead.length))await notify(v.to,`${m.name} командадан шығарылды. Сізге берілді: ${[nt?nt+' тапсырма':'',lead.length?lead.length+' жоба жетекшілігі':''].filter(Boolean).join(', ')}.`,'tasks');
 log('Командадан шығарылды',m.name+(v.reason?' — '+v.reason:''));
 toast(`${m.name} командадан шығарылды`+(nt?` · ${nt} тапсырма`:'')+(ne?` · ${ne} іс-шара тоқтатылды`:''));
}

}
async function localSetup(fm){
 const g=n=>fm.querySelector(`[name=${n}]`).value.trim();const name=g('name'),login=g('login'),pw=fm.querySelector('[name=pw]').value,pw2=fm.querySelector('[name=pw2]').value;
 const err=t=>{$('#lerr').textContent=t};
 if(!name||!login||!pw)return err('Барлық өрістерді толтырыңыз.');if(!/^[A-Za-z0-9._@+-]{3,40}$/.test(login))return err('Логин: 3–40 латын әрпі, сан немесе . _ @ + - белгілері.');if(pw.length<6)return err('Құпиясөз кемінде 6 таңба болуы керек.');if(pw!==pw2)return err('Құпиясөздер сәйкес емес.');
 if(fm.querySelector('[name=demo]').checked)S.db.merge(SEED);
 const uid='L_'+login.toLowerCase(),mid=nid();
 await S.db.doc('members/'+mid).set({name,role:'superadmin',uid,active:true,position:'Жүйе әкімшісі',visitDays:[],createdAt:now()});
 await S.db.doc(accKey(login)).set({login:login.toLowerCase(),hash:await phash(login,pw),uid,memberId:mid,createdAt:now()});
 localStart(uid);
}
async function localLogin(fm){
 const login=fm.querySelector('[name=login]').value.trim(),pw=fm.querySelector('[name=pw]').value;
 const a=await S.db.doc(accKey(login)).get();
 if(!a.exists||a.data().hash!==await phash(login,pw)){$('#lerr').textContent='Логин немесе құпиясөз қате.';return}
 if(a.data().disabled){$('#lerr').textContent='Аккаунт өшірілген. Әкімшіге хабарласыңыз.';return}
 localStart(a.data().uid);
}
function localLogout(){if(S.supa){S.sb.auth.signOut().finally(()=>{location.hash='';location.reload()});return}try{sessionStorage.removeItem('stgn_session')}catch(e){}location.hash='';location.reload()}
async function setLocalAccount(member,login,pw){
 if(!login)return true;if(!/^[A-Za-z0-9._@+-]{3,40}$/.test(login)){toast('Логин: 3–40 латын әрпі, сан немесе . _ @ + - белгілері.',1);return false}
 const ref=S.db.doc(accKey(login));const ex=await ref.get();const uid='L_'+login.toLowerCase();
 if(ex.exists&&ex.data().memberId!==member.id){toast('Бұл логин бос емес.',1);return false}
 if(!ex.exists&&(!pw||pw.length<6)){toast('Жаңа аккаунтқа кемінде 6 таңбалы құпиясөз беріңіз.',1);return false}
 const data={...(ex.exists?ex.data():{}),login:login.toLowerCase(),uid,memberId:member.id,updatedAt:now()};if(pw){if(pw.length<6){toast('Құпиясөз кемінде 6 таңба.',1);return false}data.hash=await phash(login,pw)}
 for(const d of (await S.db.collection('localAccounts').where('memberId','==',member.id).get()).docs)if(d.id!==ref.id)await S.db.doc('localAccounts/'+d.id).delete();
 await ref.set(data);if(member.uid!==uid)await S.db.doc('members/'+member.id).update({uid});return true;
}
async function boot(){
 if(CFG.supabaseUrl&&CFG.supabaseAnonKey){if(/XXXXXXXX|СІЗДІҢ_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)){S.stage='msg';S.msg='config.js файлын толтырыңыз: Supabase жобаңыздың URL мекенжайы мен anon кілтін жазыңыз (README, 3-қадам).';render();return}supaBoot();return}
 if(!window.claude||!window.claude.use){localBoot();return}
 const timer=setTimeout(()=>{if(S.stage==='boot'){S.stage='msg';S.msg='Деректер қоймасына әзірге қосылу мүмкін болмады. Интернет байланысын тексеріп, біраздан кейін бетті қайта ашыңыз.';render()}},10000);
 const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
 if(!db||!user){clearTimeout(timer);S.stage='msg';S.msg='Жүйеге кіру үшін claude.ai аккаунтыңызбен кіріңіз. Егер кірген болсаңыз, артефакт иесінен сізге қолжетімділік беруін сұраңыз.';render();return}
 S.db=db;S.user=user;
 try{S.uid=await user.id();S.profile=await user.me();S.owner=!!(await user.isOwner())}catch(e){}
 claude.use('assets').then(a=>{S.assets=a}).catch(()=>{});
 claude.use('downloads').then(d=>{S.dl=d}).catch(()=>{});
 if(!S.uid){clearTimeout(timer);S.stage='msg';S.msg='Пайдаланушыны анықтау мүмкін болмады. claude.ai аккаунтыңызбен кіріңіз.';render();return}
 db.collection('members').onSnapshot(async snap=>{clearTimeout(timer);S.members=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded.members=true;if(snap.metadata.fromCache&&!snap.size)return;await onMembers();render()},err=>{clearTimeout(timer);S.stage='msg';S.msg=err.code==='revoked'?'Қолжетімділік тоқтатылды.':'Деректерді оқу мүмкін болмады. Артефакт иесінен сізге кемінде Contributor деңгейін беруін сұраңыз.';render()});
}
boot();
}
</script>
<script>
(()=>{const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function add(i){if(i.dataset.eye)return;i.dataset.eye='1';const w=document.createElement('span');w.className='pwwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='pweye';b.setAttribute('aria-label','Құпиясөзді көрсету');b.title='Құпиясөзді көрсету';b.innerHTML=EYE;b.addEventListener('click',()=>{const show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?OFF:EYE;const t=show?'Құпиясөзді жасыру':'Құпиясөзді көрсету';b.setAttribute('aria-label',t);b.title=t;b.setAttribute('aria-pressed',show);i.focus()});w.appendChild(b)}
function scan(r){if(r.matches&&r.matches('input[type=password]'))add(r);r.querySelectorAll&&r.querySelectorAll('input[type=password]:not([data-eye])').forEach(add)}
scan(document);new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1)scan(n)}).observe(document.documentElement,{childList:true,subtree:true})})();
</script>
